[project]
name = "sesion-02-context-engineering"
version = "1.0.0"
description = "Laboratorio práctico de Function Calling con OpenAI Responses API"
requires-python = ">=3.11"
dependencies = [
  "openai==3.3.1",
  "pydantic==2.13.4",
  "python-dotenv==1.2.3",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "basic"
exclude = [".venv"]
